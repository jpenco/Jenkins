pipeline {
    agent any
    stages {
        stage('Verificar Espaço Antes') {
            steps {
                script {
                    // Armazena o tamanho em formato numérico (Kbytes) para podermos calcular a diferença depois
                    // Removemos o 'sudo' assumindo que as permissões do diretório permitem leitura, ou que o sudoers está configurado
                    env.BEFORE_KB = sh(script: "sudo du -sk /tmp /var/tmp | awk '{total+=\$1} END {print total}'", returnStdout: true).trim()
                    
                    def beforeHuman = sh(script: 'sudo du -sh /tmp /var/tmp', returnStdout: true).trim()
                    echo "Espaço ocupado antes da limpeza:\n${beforeHuman}"
                }
            }
        }
        stage('Limpeza de Cache e Temporários') {
            steps {
                script {
                    echo "Iniciando limpeza segura de arquivos temporários..."
                    sh '''
                        # Remove apenas arquivos que não mudam há mais de 1 dia (mais seguro que rm -rf /*)
                        sudo find /tmp -type f -mtime +1 -delete
                        sudo find /var/tmp -type f -mtime +1 -delete
                        
                        # Limpeza de cache do apt
                        sudo apt-get clean
                        
                        # Limpeza de logs antigos do systemd
                        sudo journalctl --vacuum-time=2d
                    '''
                }
            }
        }
        stage('Verificar Espaço Após Limpeza') {
            steps {
                script {
                    def afterHuman = sh(script: 'sudo du -sh /tmp /var/tmp', returnStdout: true).trim()
                    echo "Espaço ocupado após a limpeza:\n${afterHuman}"
                    
                    // Captura o tamanho atual em KB
                    def afterKB = sh(script: "sudo du -sk /tmp /var/tmp | awk '{total+=\$1} END {print total}'", returnStdout: true).trim()
                    
                    // Realiza o cálculo real de espaço liberado via shell
                    def savedKB = sh(script: "echo \$((${env.BEFORE_KB} - ${afterKB}))", returnStdout: true).trim()
                    
                    // Converte para MegaBytes para exibição amigável
                    def savedMB = sh(script: "echo | awk '{printf \"%.2f MB\", ${savedKB}/1024}'", returnStdout: true).trim()
                    
                    echo "✨ Total de espaço liberado nesta execução: ${savedMB}"
                }
            }
        }
    }
    post {
        always {
            echo 'Pipeline concluído.'
        }
    }
}
